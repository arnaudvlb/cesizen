services:
  database:
    image: mysql:8.4
    container_name: cesizen-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cesizen}
      MYSQL_USER: ${MYSQL_USER:-cesizen}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cesizen}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u${MYSQL_USER:-cesizen} -p${MYSQL_PASSWORD:-cesizen} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    volumes:
      - database_data:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cesizen-api
    restart: unless-stopped

    depends_on:
      database:
        condition: service_healthy

    environment:
      APP_ENV: prod

      DATABASE_URL: "mysql://${MYSQL_USER:-cesizen}:${MYSQL_PASSWORD:-cesizen}@database:3306/${MYSQL_DATABASE:-cesizen}?serverVersion=8.4&charset=utf8mb4"

    ports:
      - "8000:8000"

volumes:
  database_data: