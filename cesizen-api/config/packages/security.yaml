security:
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        
    password_hashers:
        App\Entity\Utilisateurs: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateurs
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/emotions, roles: PUBLIC_ACCESS }
        - { path: ^/api/emotion_generales, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/csrf-token, roles: PUBLIC_ACCESS}
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }