name: CI Cesizen

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main
      - dev


jobs:

  api:
    name: API - PHPUnit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cesizen-api

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_DATABASE: cesizen_test
          MYSQL_USER: cesizen
          MYSQL_PASSWORD: cesizen
          MYSQL_ROOT_PASSWORD: root

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -ucesizen -pcesizen --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      APP_SECRET: ci_secret
      KERNEL_CLASS: App\Kernel

      DATABASE_URL: "mysql://cesizen:cesizen@127.0.0.1:3306/cesizen?serverVersion=8.4&charset=utf8mb4"

      DEFAULT_URI: "http://localhost:3000"
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$'

      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: "cesizen_ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate JWT keys
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      # - name: Run database migrations
      #   run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Load fixtures
        run: php bin/console doctrine:fixtures:load --env=test --no-interaction

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Run PHPUnit
        run: php bin/phpunit --testdox

  frontweb:
    name: Front Web - Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cesizen-frontweb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cesizen-frontweb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: 1

  docker-smoke:
    name: Docker - Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start containers
        run: docker compose --env-file .env.docker up -d --build

      - name: Check containers
        run: docker compose --env-file .env.docker ps

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health/http_status_checks > /dev/null 2>&1; then
              echo "API is healthy"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 5
          done

          echo "API failed to become healthy"
          docker compose logs api
          exit 1

      - name: Run database migrations
        run: |
          docker compose --env-file .env.docker exec -T api \
            php bin/console doctrine:migrations:migrate --no-interaction

      - name: Check API endpoint
        run: curl --fail http://localhost:8000/api/emotion_generales

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is ready"
              exit 0
            fi

            echo "Waiting for frontend..."
            sleep 5
          done

          echo "Frontend failed to start"
          docker compose logs frontweb
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose --env-file .env.docker down -v